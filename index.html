<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8492e" />
    <meta name="description" content="SzpontRank — codzienne pytania i rankingi dla klasy i ekipy." />
    <link rel="manifest" href="/manifest.json" />
    <title>SzpontRank</title>
    <script>
      try {
        var zapisany = localStorage.getItem('szpontrank-motyw')
        if (zapisany === 'ciemny') {
          document.documentElement.setAttribute('data-motyw', 'ciemny')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17140f')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
